[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classmate-offline"
version = "0.1.0"
description = "Offline lecture transcription and study pack generation"
requires-python = ">=3.11,<3.14"
dependencies = ["faster-whisper==1.2.1", "av<19", "gpt4all==2.8.2", "gradio==5.49.1"]

[tool.setuptools.packages.find]
where = ["src"]